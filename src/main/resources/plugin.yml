name: ItemLimit
version: '${version}'
main: net.saturn.itemlimiter.ItemLimiter
api-version: '26.2'
load: STARTUP
authors: [PumpkinDev]
description: A minecraft plugin that let's you limit any item in the players inventory, bundles and shulkers.

commands:
  itemlimit:
    description: Manage item limitations
    usage: /<command> <add|remove|list|check|clear|containers|info|reload> [item]
    permission: itemlimiter.admin
    aliases: [ il, limititem, itemban ]

permissions:
  itemlimiter.admin:
    description: Allows use of admin commands
    default: op
